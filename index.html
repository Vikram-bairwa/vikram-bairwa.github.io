<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Health Alarm - Medicine Reminder</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg,#0f9b8e,#1abc9c);
            color:white;
        }

        .container{
            width:100%;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .card{
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius:25px;
            padding:40px 30px;
            max-width:420px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.25);
        }

        .logo{
            width:100px;
            height:100px;
            background:white;
            border-radius:50%;
            margin:auto;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:45px;
            color:#0f9b8e;
            margin-bottom:20px;
        }

        h1{
            font-size:32px;
            margin-bottom:10px;
        }

        p{
            font-size:16px;
            line-height:1.7;
            color:#f1f1f1;
            margin-bottom:25px;
        }

        .features{
            text-align:left;
            margin-bottom:30px;
        }

        .features div{
            background:rgba(255,255,255,0.15);
            padding:12px;
            border-radius:12px;
            margin-bottom:12px;
        }

        .btn{
            display:inline-block;
            background:white;
            color:#0f9b8e;
            padding:14px 28px;
            text-decoration:none;
            border-radius:50px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#f5f5f5;
            transform:scale(1.05);
        }

        .footer{
            margin-top:25px;
            font-size:13px;
            opacity:0.9;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <div class="logo">💊</div>

        <h1>Health Alarm</h1>

        <p>
            Smart Medicine Reminder & Health Alert App
            designed to help you stay healthy and never
            miss your medicines.
        </p>

        <div class="features">

            <div>⏰ Smart Medicine Reminders</div>

            <div>💡 Daily Health Tips</div>

            <div>🚨 Emergency Health Alerts</div>

            <div>📅 Easy Alarm Scheduling</div>

        </div>

        <a href="https://play.google.com/store/apps/details?id=com.healthalarm.app"
           class="btn">
           Install App
        </a>

        <div class="footer">
            © 2026 Health Alarm App
        </div>

    </div>

</div>

</body>
</html>
